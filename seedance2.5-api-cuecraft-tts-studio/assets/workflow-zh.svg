<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340"><rect width="1280" height="340" rx="20" fill="#f5f2eb"/><g font-family="Arial, Noto Sans, Hiragino Sans, sans-serif"><text x="40" y="52" font-size="27" fill="#292d28">从稿件到配音交付</text><text x="40" y="81" font-size="15" fill="#74766b">使用流程示意图 · 非运行截图</text><rect x="40" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="60" y="159" font-size="22" fill="#9e4932">粘贴稿件</text><text x="60" y="202" font-size="16" fill="#74766b">空行拆分为片段</text><path d="M322 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="347" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="367" y="159" font-size="22" fill="#9e4932">逐段生成</text><text x="367" y="202" font-size="16" fill="#74766b">每次只生成一个付费版本</text><path d="M629 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="654" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="674" y="159" font-size="22" fill="#9e4932">试听并选版</text><text x="674" y="202" font-size="16" fill="#74766b">保留之前的配音版本</text><path d="M936 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="961" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="981" y="159" font-size="22" fill="#9e4932">导出 ZIP</text><text x="981" y="202" font-size="16" fill="#74766b">MP3 + 原稿 + 参数清单</text><text x="40" y="294" font-size="19" fill="#435d4f">稿件改动后，所选音频必须与当前稿件一致才能导出。</text></g></svg>