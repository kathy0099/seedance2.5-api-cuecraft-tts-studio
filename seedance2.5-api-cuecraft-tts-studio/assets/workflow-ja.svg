<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340"><rect width="1280" height="340" rx="20" fill="#f5f2eb"/><g font-family="Arial, Noto Sans, Hiragino Sans, sans-serif"><text x="40" y="52" font-size="27" fill="#292d28">原稿からナレーション納品まで</text><text x="40" y="81" font-size="15" fill="#74766b">操作フロー図 · 実行画面ではありません</text><rect x="40" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="60" y="159" font-size="22" fill="#9e4932">原稿を貼り付け</text><text x="60" y="202" font-size="16" fill="#74766b">空行でキューに分割</text><path d="M322 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="347" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="367" y="159" font-size="22" fill="#9e4932">区間ごとに生成</text><text x="367" y="202" font-size="16" fill="#74766b">1 回に 1 つの有料テイク</text><path d="M629 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="654" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="674" y="159" font-size="22" fill="#9e4932">試聴して選択</text><text x="674" y="202" font-size="16" fill="#74766b">過去のテイクを保持</text><path d="M936 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="961" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="981" y="159" font-size="22" fill="#9e4932">ZIP を出力</text><text x="981" y="202" font-size="16" fill="#74766b">MP3 + 原稿 + 設定一覧</text><text x="40" y="294" font-size="19" fill="#435d4f">原稿を変更した場合、選択したテイクとの一致を確認してから出力。</text></g></svg>