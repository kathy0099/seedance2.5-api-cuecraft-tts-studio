<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340"><rect width="1280" height="340" rx="20" fill="#f5f2eb"/><g font-family="Arial, Noto Sans, Hiragino Sans, sans-serif"><text x="40" y="52" font-size="27" fill="#292d28">From script to delivery</text><text x="40" y="81" font-size="15" fill="#74766b">Workflow diagram · not a screenshot</text><rect x="40" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="60" y="159" font-size="22" fill="#9e4932">Paste script</text><text x="60" y="202" font-size="16" fill="#74766b">Blank lines → cues</text><path d="M322 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="347" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="367" y="159" font-size="22" fill="#9e4932">Generate a cue</text><text x="367" y="202" font-size="16" fill="#74766b">One paid take at a time</text><path d="M629 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="654" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="674" y="159" font-size="22" fill="#9e4932">Listen &amp; choose</text><text x="674" y="202" font-size="16" fill="#74766b">Keep previous takes</text><path d="M936 178h19m-7 -6 7 6 -7 6" stroke="#8b9982" stroke-width="2" fill="none"/><rect x="961" y="120" width="278" height="116" rx="10" fill="#fffdf8" stroke="#d7d8ca"/><text x="981" y="159" font-size="22" fill="#9e4932">Export ZIP</text><text x="981" y="202" font-size="16" fill="#74766b">MP3 + script + manifest</text><text x="40" y="294" font-size="19" fill="#435d4f">Draft changed? Export waits until the selected take matches.</text></g></svg>